[project]
name = "bettermdptools"
version = "0.9.0"
description = "Planning and tabular reinforcement learning tools for Gymnasium environments"
authors = [
    { name = "John Mansfield", email = "jlm429@gmail.com" },
]
license = "BSD-3-Clause"
readme = "README.md"
requires-python = ">=3.10,<3.13"
keywords = ["gymnasium", "markov-decision-process", "reinforcement-learning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "gymnasium>=1.3.0,<1.4",
    "pygame>=2.6,<3",
    "numpy>=1.26,<2",
    "tqdm>=4.67,<5",
    "pandas>=2.2,<3",
    "seaborn>=0.13,<0.14",
    "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
optuna = ["optuna>=4.6,<5"]

[project.urls]
Documentation = "https://jlm429.github.io/bettermdptools/bettermdptools.html"
Repository = "https://github.com/jlm429/bettermdptools"

[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
pdoc = "16.0.0"

[tool.poetry.group.dev.dependencies]
black = "^26.3.1"
pytest = "^9.0.0"
ruff = "^0.14.8"

[build-system]
requires = ["poetry-core>=2.2.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "I"]
ignore = ["E203"]

[tool.ruff.lint.isort]
known-first-party = ["bettermdptools"]

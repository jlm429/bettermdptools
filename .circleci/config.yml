version: 2.1

jobs:
  test:
    parameters:
      python-version:
        type: string
      numpy-version:
        type: string
    docker:
      - image: cimg/python:<< parameters.python-version >>-node
    steps:
      - checkout

      - run:
          name: Install Poetry
          command: |
            pip install --upgrade pip
            pip install poetry

      - run:
          name: Configure Poetry
          command: |
            poetry --version
            poetry config virtualenvs.in-project true

      - run:
          name: Validate base installation without rendering
          command: |
            poetry install --no-interaction
            poetry run python - <<'PY'
            from importlib import metadata

            import gymnasium as gym

            from bettermdptools.algorithms.planner import Planner

            for distribution in ("pygame", "pygame-ce"):
                try:
                    metadata.version(distribution)
                except metadata.PackageNotFoundError:
                    continue
                raise AssertionError(f"Base install unexpectedly includes {distribution}")

            env = gym.make("FrozenLake-v1")
            try:
                values, _, policy = Planner(env.unwrapped.P).value_iteration(n_iters=10)
                assert values.shape == (env.observation_space.n,)
                assert len(policy) == env.observation_space.n
            finally:
                env.close()
            PY

      - run:
          name: Install and verify pygame-ce rendering extra
          command: |
            poetry install --no-interaction --extras rendering
            poetry run python - <<'PY'
            from importlib import metadata

            try:
                metadata.version("pygame")
            except metadata.PackageNotFoundError:
                pass
            else:
                raise AssertionError("Classic pygame must not be installed")

            print("pygame-ce", metadata.version("pygame-ce"))
            import pygame
            print("pygame import", pygame.version.ver)
            PY

      - run:
          name: Install supported NumPy version
          command: |
            poetry run pip install "numpy==<< parameters.numpy-version >>"
            poetry run pip check

      - run:
          name: Run tests
          command: |
            SDL_AUDIODRIVER=dummy SDL_VIDEODRIVER=dummy poetry run pytest tests

workflows:
  version: 2
  test:
    jobs:
      - test:
          name: python-3.12-numpy-2.0.2
          python-version: "3.12"
          numpy-version: "2.0.2"
      - test:
          name: python-3.13-numpy-2.1.0
          python-version: "3.13"
          numpy-version: "2.1.0"
      - test:
          name: python-3.14-numpy-2.3.4
          python-version: "3.14"
          numpy-version: "2.3.4"
